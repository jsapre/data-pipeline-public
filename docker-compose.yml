services:
  # --- POSTGRESQL ---
  postgres:
    image: postgres:16-alpine
    platform: linux/arm64
    container_name: pipeline-postgres
    environment:
      POSTGRES_DB: reporting_db
      POSTGRES_USER: pipeline_user
      POSTGRES_PASSWORD: pipeline_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # --- KAFKA (KRaft Mode) ---
  kafka:
    image: apache/kafka:3.7.0
    platform: linux/arm64
    container_name: pipeline-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"
      KAFKA_CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"

  # --- HADOOP HDFS NAMENODE ---
  namenode:
    image: apache/hadoop:3.3.6
    platform: linux/arm64
    container_name: pipeline-namenode
    entrypoint: []
    command:
      - /bin/bash
      - -c
      - |
        cat <<EOF > /opt/hadoop/etc/hadoop/core-site.xml
        <configuration>
          <property>
            <name>fs.defaultFS</name>
            <value>hdfs://namenode:9000</value>
          </property>
        </configuration>
        EOF

        cat <<EOF > /opt/hadoop/etc/hadoop/hdfs-site.xml
        <configuration>
          <property>
            <name>dfs.replication</name>
            <value>1</value>
          </property>
        </configuration>
        EOF

        mkdir -p /tmp/hadoop-root/dfs/name
        if [ ! -d "/tmp/hadoop-root/dfs/name/current" ]; then
          /opt/hadoop/bin/hdfs namenode -format -force -nonInteractive
        fi
        /opt/hadoop/bin/hdfs namenode
    ports:
      - "9870:9870"
      - "9000:9000"

  # --- HADOOP HDFS DATANODE ---
  datanode:
    image: apache/hadoop:3.3.6
    platform: linux/arm64
    container_name: pipeline-datanode
    entrypoint: []
    command:
      - /bin/bash
      - -c
      - |
        cat <<EOF > /opt/hadoop/etc/hadoop/core-site.xml
        <configuration>
          <property>
            <name>fs.defaultFS</name>
            <value>hdfs://namenode:9000</value>
          </property>
        </configuration>
        EOF

        cat <<EOF > /opt/hadoop/etc/hadoop/hdfs-site.xml
        <configuration>
          <property>
            <name>dfs.replication</name>
            <value>1</value>
          </property>
        </configuration>
        EOF

        /opt/hadoop/bin/hdfs datanode
    depends_on:
      - namenode

  # --- APACHE SPARK MASTER ---
  spark-master:
    image: apache/spark:3.5.1
    platform: linux/arm64
    container_name: pipeline-spark-master
    entrypoint:
      ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    ports:
      - "8080:8080"
      - "7077:7077"

  # --- APACHE SPARK WORKER ---
  spark-worker:
    image: apache/spark:3.5.1
    platform: linux/arm64
    container_name: pipeline-spark-worker
    entrypoint:
      [
        "/opt/spark/bin/spark-class",
        "org.apache.spark.deploy.worker.Worker",
        "spark://spark-master:7077",
      ]
    depends_on:
      - spark-master

volumes:
  pgdata:
